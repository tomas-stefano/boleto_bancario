name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3', '3.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      - name: Run tests with coverage
        if: matrix.ruby-version == '3.3'
        run: COVERAGE=true bundle exec rspec
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Check for frozen string literal
        run: |
          find lib spec -name '*.rb' | while read file; do
            if ! head -n1 "$file" | grep -q "frozen_string_literal"; then
              echo "Missing frozen_string_literal in $file"
              exit 1
            fi
          done
        continue-on-error: true
